name: test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A new push to a PR stops its older run; runs on main always finish (each one publishes).
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        # PRs test macOS on one Python; main and tags test all of them before publishing
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","python":"3.11"},{"os":"macos-latest","python":"3.13"}]') || fromJSON('[]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from git tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: diagnose slow startup (temporary)
        if: runner.os == 'macOS'
        run: |
          python -c "import socket,time; t=time.time(); socket.getfqdn('127.0.0.1'); print('getfqdn', round(time.time()-t,2))"
          python -c "import socket,time; t=time.time(); socket.gethostbyname(socket.gethostname()); print('gethostbyname', round(time.time()-t,2))"
          tuieval init "$RUNNER_TEMP/ws" >/dev/null
          cd "$RUNNER_TEMP/ws" && mkdir -p packs/apps && printf 'label = "apps"\n' > packs/apps/pack.toml
          printf -- "- {id: a, input: q, expected: 1, reference: 'ANSWER: 1'}\n" > packs/apps/tests.yaml
          export TUIEVAL_HOME="$RUNNER_TEMP/ws" TUIEVAL_DETECT_PORTS=""
          time tuieval run --tests a || true
          python -m cProfile -s cumtime -m tuieval run --tests a 2>&1 | head -45 || true
      - run: python -m unittest discover -s tests -v

  # Every push to main is published as a dev build (X.Y.0.devN, installed with pip install --pre);
  # a tag vX.Y.Z is published as that release. PyPI trusted publishing: no token is stored anywhere.
  publish:
    needs: test
    if: github.event_name == 'push' && github.repository == 'ashe-wb/tuieval' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check dist/*
      - run: ls dist
      - uses: pypa/gh-action-pypi-publish@release/v1
