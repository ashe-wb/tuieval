[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tuieval"
dynamic = ["version"]
description = "Evaluate local LLMs on your own eval packs, in the terminal: accuracy, speed and tokens, with PASS/FAIL verdicts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "tuieval contributors" }]
keywords = ["llm", "evaluation", "evals", "llama.cpp", "local-llm", "tui", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "textual>=8,<9",
  "pyyaml>=6",
]

[project.scripts]
tuieval = "tuieval.cli:main"

[project.urls]
Homepage = "https://github.com/ashe-wb/tuieval"
Issues = "https://github.com/ashe-wb/tuieval/issues"

[tool.hatch.version]
path = "src/tuieval/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tuieval"]

[tool.hatch.build.targets.sdist]
include = ["src/", "docs/", "tests/", "packaging/", "README.md", "LICENSE", "CHANGELOG.md"]
