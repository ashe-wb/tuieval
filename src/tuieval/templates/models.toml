# Your servers, models and settings. Every option: docs/models.md
# (https://github.com/ashe-wb/tuieval/blob/main/docs/models.md)
#
# Built in, no setup needed (define one here, with the same name, to change it):
#   llama       starts llama-server for each GGUF model:   tuieval add ~/models/Model-Q4_K_M.gguf
#   local       a server already running at http://127.0.0.1:1234
#   openrouter  any OpenRouter model, by name:   tuieval run --only openrouter:<model id>
#               (needs OPENROUTER_API_KEY)
# `tuieval add` finds models on servers that are already running (LM Studio, Ollama, vLLM…)
# and adds them below, with their server.

[defaults]
repeat = 3                     # rounds of every question in a Certify run
model_dirs = ["~/models"]      # where scanning looks for GGUFs

# Sent with every request, the same for every model so results compare.
[sampling]
temperature = 0.7
top_p = 0.95
top_k = 20
min_p = 0.0
max_tokens = 16384
enable_thinking = true         # test every model in the same mode
